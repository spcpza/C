<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>solichin.org FPV preview</title>
<style>
  html,body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
  main{max-width:420px;margin:0 auto;padding:16px}
  h1{font-size:18px;font-weight:600;margin:0 0 8px}
  p{font-size:13px;opacity:.75;margin:0 0 16px;line-height:1.4}
  video{width:100%;border-radius:8px;background:#000}
  .shots{display:grid;gap:10px;margin-top:20px}
  img{width:100%;border-radius:8px}
</style>
</head>
<body>
<main>
  <h1>FPV drone preview</h1>
  <p>First-person fly-through — you are the drone. Temporary preview hosted from the C repo until foundation write access is granted.</p>
  <video src="phone-fpv-loop.mp4" controls playsinline autoplay muted loop></video>
  <div class="shots">
    <img src="01-wide.jpg" alt="Wide hover">
    <img src="02-push-in.jpg" alt="Push in">
    <img src="03-ots-god.jpg" alt="OTS God">
    <img src="05-through-light.jpg" alt="Through the light">
    <img src="06-ots-adam.jpg" alt="OTS Adam">
  </div>
</main>
</body>
</html>
